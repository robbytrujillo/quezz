<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Quiz Pilihan Ganda Interaktif</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style2.css" />

    <!-- Font Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="gameCanvas"> </canvas>
    <div class="container">
      <div class="header">
        <h1>Quiz Pilihan Ganda Interaktif</h1>
        <p>Tambah, Edit, Hapus Soal + Kerjakan Quiz</p>
      </div>

      <!-- FORM TAMBAH / EDIT -->
      <div class="card">
        <h2 id="formTitle">Tambah Soal</h2>
        <div class="form-group">
          <label>Pertanyaan</label>
          <input type="text" id="question" />
        </div>

        <div class="form-group">
          <label>Pilihan A</label>
          <input type="text" id="optionA" />
        </div>

        <div class="form-group">
          <label>Pilihan B</label>
          <input type="text" id="optionB" />
        </div>

        <div class="form-group">
          <label>Pilihan C</label>
          <input type="text" id="optionC" />
        </div>

        <div class="form-group">
          <label>Pilihan D</label>
          <input type="text" id="optionD" />
        </div>

        <div class="form-group">
          <label>Kunci Jawaban</label>
          <select id="answerKey">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>

        <button class="btn-primary" onclick="saveQuestion()">
          Simpan Soal
        </button>
      </div>

      <!-- LIST SOAL -->
      <div class="card">
        <h2>Daftar Soal</h2>
        <div id="questionList"></div>
      </div>

      <!-- QUIZ -->
      <div class="card">
        <h2>Kerjakan Quiz</h2>
        <form id="quizForm"></form>
        <button class="btn-success" onclick="submitQuiz()">Submit Quiz</button>
        <div id="result" class="result-box"></div>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="main.js"></script>
  </body>
</html>
